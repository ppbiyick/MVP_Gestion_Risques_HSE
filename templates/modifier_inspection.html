<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier une inspection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head   <h1>✏️ Modifier une inspection</h1>
<h2 style="color:#2c3e50;">
    Inspection #{{ inspection[0] }}
</h2>
<p>MVP_Gestion de risques SSE</p>
<hr>
    
    <form method="POST">

        <p>
            <label>Date :</label><br>
            <input
                type="date"
                name="date"
                value="{{ inspection[1] }}"
                required>
        </p>

        <p>
            <label>Inspecteur :</label><br>
            <input
                type="text"
                name="inspecteur"
                value="{{ inspection[2] }}"
                required>
        </p>

        <p>
            <label>Secteur :</label><br>
            <input
                type="text"
                name="secteur"
                value="{{ inspection[3] }}"
                required>
        </p>

        <p>
            <label>Risque :</label><br>
            <input
                type="text"
                name="risque"
                value="{{ inspection[4] }}"
                required>
        </p>

        <p>
            <label>Observation :</label><br>
            <textarea
                rows="4"
                name="observation">{{ inspection[5] }}</textarea>
        </p>

        <p>
            <label>Mesures correctives :</label><br>
            <textarea
                rows="4"
                name="mesures_correctives">{{ inspection[6] }}</textarea>
        </p>

        <button class="btn" type="submit">
            💾 Enregistrer les modifications
        </button>

    </form>

    <br><br>

    <a href="{{ url_for('liste') }}" class="btn">
        📋 Retour à la liste
    </a>

    <br><br>

    <a href="{{ url_for('accueil') }}" class="btn">
        🏠 Retour au tableau de bord
    </a>
</div>
</body>
</html>
